<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nael Lakhledj</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0a;
  color: #f5f0eb;
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  position: relative;
  overflow: hidden;
}

/* Croix rouge décorative en fond */
body::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 600px; height: 600px;
  background:
    linear-gradient(#e8192c 0 0) center/4px 100%,
    linear-gradient(#e8192c 0 0) center/100% 4px;
  background-repeat: no-repeat;
  opacity: 0.04;
}

body::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 800px; height: 800px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,25,44,0.06) 0%, transparent 65%);
}

.content {
  position: relative;
  z-index: 1;
  animation: fadeIn 1s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.65rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #e8192c;
  margin-bottom: 2rem;
}
.tag::before { content: ''; width: 24px; height: 1px; background: #e8192c; }
.tag::after  { content: ''; width: 24px; height: 1px; background: #e8192c; }

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(4rem, 12vw, 9rem);
  font-weight: 900;
  color: #fff;
  line-height: 0.88;
  letter-spacing: -0.03em;
  margin-bottom: 2rem;
}

h1 .outline {
  color: transparent;
  -webkit-text-stroke: 1.5px rgba(255,255,255,0.5);
}

.subtitle {
  font-size: 0.85rem;
  color: #888;
  letter-spacing: 0.08em;
  margin-bottom: 3rem;
  line-height: 1.8;
}

.subtitle span { color: #ccc; }

.cta {
  display: inline-flex;
  align-items: center;
  gap: 1rem;
}

.btn-main {
  background: #e8192c;
  color: #fff;
  padding: 1rem 2.5rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-decoration: none;
  display: inline-block;
  position: relative;
  overflow: hidden;
  transition: color 0.35s;
}
.btn-main::before {
  content: '';
  position: absolute; inset: 0;
  background: #fff;
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.btn-main:hover::before { transform: scaleX(1); }
.btn-main:hover { color: #e8192c; }
.btn-main span { position: relative; z-index: 1; }

.btn-sec {
  color: #888;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  transition: color 0.3s;
}
.btn-sec:hover { color: #fff; }
.btn-sec-arrow {
  width: 24px; height: 1px;
  background: currentColor;
  position: relative;
  transition: width 0.3s;
}
.btn-sec-arrow::after {
  content: '';
  position: absolute; right: 0; top: -3px;
  width: 6px; height: 6px;
  border-right: 1px solid currentColor;
  border-top: 1px solid currentColor;
  transform: rotate(45deg);
}
.btn-sec:hover .btn-sec-arrow { width: 40px; }

/* Coins décoratifs */
.corner {
  position: fixed;
  width: 40px; height: 40px;
  opacity: 0.25;
}
.corner-tl { top: 2rem; left: 2rem; border-top: 1px solid #e8192c; border-left: 1px solid #e8192c; }
.corner-tr { top: 2rem; right: 2rem; border-top: 1px solid #e8192c; border-right: 1px solid #e8192c; }
.corner-bl { bottom: 2rem; left: 2rem; border-bottom: 1px solid #e8192c; border-left: 1px solid #e8192c; }
.corner-br { bottom: 2rem; right: 2rem; border-bottom: 1px solid #e8192c; border-right: 1px solid #e8192c; }

/* Stats bas de page */
.stats {
  position: fixed;
  bottom: 2.5rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 3rem;
  font-size: 0.65rem;
  color: #444;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  white-space: nowrap;
}
.stats span { color: #e8192c; font-weight: 500; margin-right: 0.4rem; }

/* Disponible indicator */
.avail {
  position: fixed;
  top: 2rem; right: 2rem;
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: #555;
}
.avail-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #22c55e;
  animation: blink 2s infinite;
}
@keyframes blink {
  0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
  50%      { box-shadow: 0 0 0 5px rgba(34,197,94,0); }
}

@media (max-width: 600px) {
  .cta { flex-direction: column; align-items: center; }
  .stats { gap: 1.5rem; font-size: 0.55rem; }
}
</style>
</head>
<body>

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="avail">
  <div class="avail-dot"></div>
  Disponible Sept. 2026
</div>

<div class="content">
  <div class="tag">Portfolio</div>

  <h1>
    Nael<br>
    <span class="outline">Lakhledj</span>
  </h1>

  <p class="subtitle">
    <span>Administrateur réseaux</span> · BTS SIO SISR<br>
    Cisco · pfSense · Active Directory · Proxmox
  </p>

  <div class="cta">
    <a href="portfolio-nael.html" class="btn-main"><span>Voir le portfolio →</span></a>
    <a href="mailto:nlakhledj@gmail.com" class="btn-sec">
      Me contacter
      <span class="btn-sec-arrow"></span>
    </a>
  </div>
</div>

<div class="stats">
  <div><span>CCNA</span>Certifié</div>
  <div><span>4+</span>Expériences</div>
  <div><span>2026</span>BTS SIO</div>
  <div><span>IDF</span>Paris</div>
</div>

</body>
</html>
